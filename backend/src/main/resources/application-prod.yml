# Production Environment Configuration
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
  logging:
    level:
      com.ideas2it.maintenanceservice: INFO
      root: WARN

# Production AWS Configuration
app:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}

# Production JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

# Production File Upload Configuration
app:
  file-upload:
    max-size: ${FILE_MAX_SIZE:20971520} # 20MB for production
    allowed-types: ${FILE_ALLOWED_TYPES:image/*,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}

# Production Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: / 