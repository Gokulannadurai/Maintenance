# Application Configuration
spring:
  application:
    name: maintenance-service
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/maintenance_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  
  # Logging Configuration
  logging:
    level:
      com.ideas2it.maintenanceservice: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Application Configuration Properties
app:
  jwt:
    secret: ${JWT_SECRET:MySecretKeyForJWT1234567890}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  file-upload:
    max-size: ${FILE_MAX_SIZE:10485760} # 10MB in bytes
    allowed-types: ${FILE_ALLOWED_TYPES:image/*,application/pdf,text/plain}
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:your-s3-bucket-name}
    access-key-id: ${AWS_ACCESS_KEY_ID:your-access-key-id}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:your-secret-access-key}
    region: ${AWS_REGION:us-east-1}

# JWT Configuration (legacy support)
jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT1234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# AWS S3 Configuration (legacy support)
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:your-s3-bucket-name}
  accessKeyId: ${AWS_ACCESS_KEY_ID:your-access-key-id}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY:your-secret-access-key}
  region: ${AWS_REGION:us-east-1}

# File Upload Configuration (legacy support)
file:
  upload:
    max-size: ${FILE_MAX_SIZE:10485760} # 10MB in bytes
    allowed-types: ${FILE_ALLOWED_TYPES:image/*,application/pdf,text/plain}

# Environment-specific configurations
---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  logging:
    level:
      com.ideas2it.maintenanceservice: DEBUG